<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#E00000"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>

  <!--
    7 note cards — 3×3 grid, top-left and bottom-right cells empty:
      _  do  re
     mi  fa sol
     la  si  _

    Column x: 0→10, 1→206, 2→402   width=186  gap=10
    Row    y: 0→10, 1→206, 2→402   height=186 gap=10

    Staff lines (spacing=12, top→bottom = F5,D5,B4,G4,E4):
      y = cy+20, cy+32, cy+44, cy+56, cy+68
    Note head y offsets from cy:
      C4=80(+ledger)  D4=74  E4=68  F4=62  G4=56  A4=50  B4=44
    Note head x = cx+130   Stem x = cx+136
    Treble clef: x=cx+23  y=cy+74  font-size=56
    Name label: x=cx+93  y=cy+170  text-anchor=middle
  -->

  <!-- ═══ (1,0) до / C4   cx=206 cy=10 ════════════════════════════════════ -->
  <rect x="206" y="10" width="186" height="186" rx="14"
        fill="white" fill-opacity="0.14" stroke="white" stroke-opacity="0.35" stroke-width="2"/>
  <g stroke="white" stroke-width="1.5" opacity="0.82">
    <line x1="228" y1="30"  x2="386" y2="30"/>
    <line x1="228" y1="42"  x2="386" y2="42"/>
    <line x1="228" y1="54"  x2="386" y2="54"/>
    <line x1="228" y1="66"  x2="386" y2="66"/>
    <line x1="228" y1="78"  x2="386" y2="78"/>
  </g>
  <text x="229" y="84" font-size="56" font-family="'Segoe UI Symbol',serif" fill="white" opacity="0.95">&#x1D11E;</text>
  <!-- ledger line for C4 -->
  <line x1="322" y1="90" x2="350" y2="90" stroke="white" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="336" cy="90" rx="8" ry="5.5" fill="white" transform="rotate(-15 336 90)"/>
  <line x1="342" y1="88" x2="342" y2="54" stroke="white" stroke-width="1.5"/>
  <text x="299" y="180" text-anchor="middle" font-size="28" font-weight="900"
        font-family="Arial,Helvetica,sans-serif" fill="white">до</text>

  <!-- ═══ (2,0) ре / D4   cx=402 cy=10 ════════════════════════════════════ -->
