  <g stroke="white" stroke-width="1.5" opacity="0.82">
    <line x1="228" y1="422" x2="386" y2="422"/>
    <line x1="228" y1="434" x2="386" y2="434"/>
    <line x1="228" y1="446" x2="386" y2="446"/>
    <line x1="228" y1="458" x2="386" y2="458"/>
