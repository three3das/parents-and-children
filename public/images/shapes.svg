<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#E00000"/>
    </linearGradient>
    <radialGradient id="sphG" cx="36%" cy="32%" r="60%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="52%"  stop-color="#E2E2E2"/>
      <stop offset="100%" stop-color="#AAAAAA"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="300" y="50" text-anchor="middle" font-size="34" font-weight="900"
        font-family="Arial,Helvetica,sans-serif" fill="white" letter-spacing="3">2D → 3D</text>

  <!-- Separator -->
  <line x1="18" y1="268" x2="582" y2="268"
        stroke="rgba(255,255,255,0.50)" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="18" y="262" font-size="18" font-weight="800"
        font-family="Arial,sans-serif" fill="rgba(255,255,255,0.75)">2D</text>
  <text x="18" y="292" font-size="18" font-weight="800"
        font-family="Arial,sans-serif" fill="rgba(255,255,255,0.75)">3D</text>

  <!--
    x-centers: 72  186  300  414  528
    2D row  y≈155  |  3D row  y≈408
  -->

  <!-- ══════════════ 2D SHAPES ══════════════ -->

  <!-- 1. Circle (cx=72, cy=155, r=50) -->
  <circle cx="72" cy="155" r="50"
          fill="rgba(255,255,255,0.22)" stroke="white" stroke-width="5"/>

  <!-- 2. Square (center 186,155  side=70) -->
  <rect x="151" y="120" width="70" height="70"
        fill="rgba(255,255,255,0.22)" stroke="white" stroke-width="5"/>

  <!-- 3. Rectangle (center 300,155  100×56) -->
  <rect x="250" y="127" width="100" height="56"
        fill="rgba(255,255,255,0.22)" stroke="white" stroke-width="5"/>

  <!-- 4. Triangle (center 414,155) -->
  <polygon points="414,107 458,200 370,200"
           fill="rgba(255,255,255,0.22)" stroke="white" stroke-width="5"
           stroke-linejoin="round"/>

  <!-- 5. Oval / Ellipse (cx=528, cy=155  rx=40 ry=24) -->
  <ellipse cx="528" cy="155" rx="40" ry="24"
           fill="rgba(255,255,255,0.22)" stroke="white" stroke-width="5"/>

  <!-- ══════════════ ARROWS DOWN ══════════════ -->
  <g text-anchor="middle" font-size="28" fill="white" opacity="0.82"
     font-family="Arial,sans-serif">
    <text x="72"  y="252">↓</text>
    <text x="186" y="252">↓</text>
    <text x="300" y="252">↓</text>
    <text x="414" y="252">↓</text>
    <text x="528" y="252">↓</text>
  </g>

  <!-- ══════════════ 3D SHAPES ══════════════ -->
  <!-- face colors: lit=white, mid=#D4D4D4, dark=#AAAAAA -->

  <!-- 1. Sphere (cx=72, cy=408, r=52) -->
  <circle cx="72" cy="408" r="52" fill="url(#sphG)"/>

  <!-- 2. Cube (center≈188, front 58×58, depth +18,-13) -->
  <!-- front face -->
  <polygon points="157,381 215,381 215,439 157,439" fill="white"/>
  <!-- top face -->
  <polygon points="157,381 215,381 233,368 175,368" fill="#D4D4D4"/>
  <!-- right face -->
  <polygon points="215,381 233,368 233,426 215,439" fill="#AAAAAA"/>
  <!-- edges -->
  <polyline points="157,381 175,368 233,368" fill="none" stroke="#888" stroke-width="1"/>
  <line x1="233" y1="368" x2="233" y2="426" stroke="#888" stroke-width="1"/>

  <!-- 3. Rectangular prism (center≈300, front 100×46, depth +18,-13) -->
  <!-- front -->
  <polygon points="250,392 350,392 350,438 250,438" fill="white"/>
  <!-- top -->
  <polygon points="250,392 350,392 368,379 268,379" fill="#D4D4D4"/>
  <!-- right -->
  <polygon points="350,392 368,379 368,425 350,438" fill="#AAAAAA"/>
  <!-- edges -->
  <polyline points="250,392 268,379 368,379" fill="none" stroke="#888" stroke-width="1"/>
  <line x1="368" y1="379" x2="368" y2="425" stroke="#888" stroke-width="1"/>

  <!-- 4. Pyramid (center≈414, base 82, h=82) -->
  <!-- front face -->
  <polygon points="414,352 455,434 373,434" fill="white"/>
  <!-- right face -->
  <polygon points="414,352 455,434 467,423" fill="#C0C0C0"/>
  <!-- base back edge -->
  <line x1="373" y1="434" x2="467" y2="423" stroke="#999" stroke-width="1.5"/>
  <!-- hidden apex-to-back dashed -->
  <line x1="414" y1="352" x2="420" y2="422"
        stroke="rgba(255,255,255,0.40)" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- 5. Cylinder (cx=528, rx=32, ry=11, top-y=368, bottom-y=435) -->
  <!-- body -->
  <rect x="496" y="368" width="64" height="67" fill="white"/>
  <!-- bottom ellipse -->
  <ellipse cx="528" cy="435" rx="32" ry="11" fill="#D0D0D0"/>
  <!-- top ellipse -->
  <ellipse cx="528" cy="368" rx="32" ry="11" fill="#EEEEEE"/>
  <!-- side edges -->
  <line x1="496" y1="368" x2="496" y2="435" stroke="#D8D8D8" stroke-width="1.5"/>
  <line x1="560" y1="368" x2="560" y2="435" stroke="#D8D8D8" stroke-width="1.5"/>
</svg>
