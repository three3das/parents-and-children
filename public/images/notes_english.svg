<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#E00000"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Left column: 7 note names (spacing=80, baseline y=60..540) -->
  <text x="80" y="60"  text-anchor="middle" font-size="48" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="white">do</text>
  <text x="80" y="140" text-anchor="middle" font-size="48" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="white">re</text>
  <text x="80" y="220" text-anchor="middle" font-size="48" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="white">mi</text>
  <text x="80" y="300" text-anchor="middle" font-size="48" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="white">fa</text>
  <text x="80" y="380" text-anchor="middle" font-size="48" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="white">sol</text>
  <text x="80" y="460" text-anchor="middle" font-size="48" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="white">la</text>
  <text x="80" y="540" text-anchor="middle" font-size="48" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="white">ti</text>

  <!-- Two birds on a branch (top right) -->
  <!-- Branch -->
  <path d="M335,202 Q440,192 545,187 Q565,186 582,184" stroke="white" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Bird 1 (larger) -->
  <ellipse cx="410" cy="170" rx="30" ry="17" fill="white" transform="rotate(-15,410,170)"/>
  <circle cx="434" cy="155" r="15" fill="white"/>
  <path d="M447,153 L462,156 L447,159 Z" fill="white"/>
  <path d="M383,175 Q368,167 360,172 Q368,182 383,175 Z" fill="white"/>
  <line x1="412" y1="186" x2="407" y2="202" stroke="white" stroke-width="2.5"/>
  <line x1="419" y1="187" x2="425" y2="202" stroke="white" stroke-width="2.5"/>
  <!-- Bird 2 (smaller) -->
  <ellipse cx="510" cy="160" rx="26" ry="14" fill="white" transform="rotate(-15,510,160)"/>
  <circle cx="531" cy="146" r="13" fill="white"/>
  <path d="M542,144 L555,147 L542,150 Z" fill="white"/>
  <path d="M487,164 Q474,157 467,161 Q474,171 487,164 Z" fill="white"/>
  <line x1="512" y1="173" x2="507" y2="187" stroke="white" stroke-width="2.5"/>
  <line x1="518" y1="174" x2="524" y2="187" stroke="white" stroke-width="2.5"/>

  <!-- Musical staff at bottom (x=165–575, spacing=28, bottom line y=530) -->
  <line x1="165" y1="530" x2="575" y2="530" stroke="white" stroke-width="2.5"/>
  <line x1="165" y1="502" x2="575" y2="502" stroke="white" stroke-width="2.5"/>
  <line x1="165" y1="474" x2="575" y2="474" stroke="white" stroke-width="2.5"/>
  <line x1="165" y1="446" x2="575" y2="446" stroke="white" stroke-width="2.5"/>
  <line x1="165" y1="418" x2="575" y2="418" stroke="white" stroke-width="2.5"/>
  <line x1="165" y1="418" x2="165" y2="530" stroke="white" stroke-width="2.5"/>
  <!-- Treble clef -->
  <text x="167" y="543" font-size="132" font-family="Georgia,Times New Roman,serif" fill="white">𝄞</text>

  <!-- Ledger line for Do (C4) -->
  <line x1="256" y1="558" x2="282" y2="558" stroke="white" stroke-width="2.5"/>

  <!-- Note heads: Do C4 y=558, Re D4 y=544, Mi E4 y=530, Fa F4 y=516,
       Sol G4 y=502, La A4 y=488, Ti B4 y=474 -->
  <ellipse cx="270" cy="558" rx="12.5" ry="8.5" fill="white" transform="rotate(-15,270,558)"/>
  <ellipse cx="318" cy="544" rx="12.5" ry="8.5" fill="white" transform="rotate(-15,318,544)"/>
  <ellipse cx="366" cy="530" rx="12.5" ry="8.5" fill="white" transform="rotate(-15,366,530)"/>
  <ellipse cx="414" cy="516" rx="12.5" ry="8.5" fill="white" transform="rotate(-15,414,516)"/>
  <ellipse cx="462" cy="502" rx="12.5" ry="8.5" fill="white" transform="rotate(-15,462,502)"/>
  <ellipse cx="510" cy="488" rx="12.5" ry="8.5" fill="white" transform="rotate(-15,510,488)"/>
  <ellipse cx="558" cy="474" rx="12.5" ry="8.5" fill="white" transform="rotate(-15,558,474)"/>

  <!-- Stems (up for Do–La, down for Ti) -->
  <line x1="282" y1="558" x2="282" y2="503" stroke="white" stroke-width="2"/>
  <line x1="330" y1="544" x2="330" y2="489" stroke="white" stroke-width="2"/>
  <line x1="378" y1="530" x2="378" y2="475" stroke="white" stroke-width="2"/>
  <line x1="426" y1="516" x2="426" y2="461" stroke="white" stroke-width="2"/>
  <line x1="474" y1="502" x2="474" y2="447" stroke="white" stroke-width="2"/>
  <line x1="522" y1="488" x2="522" y2="433" stroke="white" stroke-width="2"/>
  <line x1="546" y1="474" x2="546" y2="529" stroke="white" stroke-width="2"/>
</svg>
