<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#E00000"/>
    </linearGradient>
  </defs>

  <!-- Red gradient background -->
  <rect width="600" height="600" fill="url(#bg)"/>

  <!--
    Circle centre (300,300), radius 240
    6 equal sectors of 60° each, clockwise from top (-90°):
      Sector 1  Sea          −90° → −30°   top-right
      Sector 2  Plants       −30° →  30°   right
      Sector 3  Insects       30° →  90°   bottom-right
      Sector 4  Birds         90° → 150°   bottom-left
      Sector 5  Animals      150° → 210°   left
      Sector 6  People       210° → 270°   top-left

    Arc edge points (r=240):
      −90°  →  (300, 60)
      −30°  →  (508, 180)
       30°  →  (508, 420)
       90°  →  (300, 540)
      150°  →  ( 92, 420)
      210°  →  ( 92, 180)
  -->

  <!-- ══════════ SECTORS ══════════ -->
  <path d="M 300,300 L 300,60  A 240,240 0 0 1 508,180 Z" fill="#1565C0"/>  <!-- Sea      -->
  <path d="M 300,300 L 508,180 A 240,240 0 0 1 508,420 Z" fill="#2E7D32"/>  <!-- Plants   -->
  <path d="M 300,300 L 508,420 A 240,240 0 0 1 300,540 Z" fill="#F57F17"/>  <!-- Insects  -->
  <path d="M 300,300 L 300,540 A 240,240 0 0 1 92,420  Z" fill="#0097A7"/>  <!-- Birds    -->
  <path d="M 300,300 L 92,420  A 240,240 0 0 1 92,180  Z" fill="#BF360C"/>  <!-- Animals  -->
  <path d="M 300,300 L 92,180  A 240,240 0 0 1 300,60  Z" fill="#6A1B9A"/>  <!-- People   -->

  <!-- ══════════ OUTER RING & DIVIDERS ══════════ -->
  <circle cx="300" cy="300" r="240" fill="none" stroke="white" stroke-width="6"/>
  <g stroke="white" stroke-width="4">
    <line x1="300" y1="300" x2="300" y2="60"/>
    <line x1="300" y1="300" x2="508" y2="180"/>
    <line x1="300" y1="300" x2="508" y2="420"/>
    <line x1="300" y1="300" x2="300" y2="540"/>
    <line x1="300" y1="300" x2="92"  y2="420"/>
    <line x1="300" y1="300" x2="92"  y2="180"/>
  </g>

  <!--
    Icon centres (bisector of each sector, 0.60×r = 144 from centre):
      Sea      −60°  (372, 175)
      Plants     0°  (444, 300)
      Insects   60°  (372, 425)
      Birds    120°  (228, 425)
      Animals  180°  (156, 300)
      People   240°  (228, 175)
  -->

  <!-- ══════════ 1. SEA — fish + wave ══════════ -->
  <g fill="white" opacity="0.95">
    <polygon points="347,175 334,162 334,188"/>             <!-- tail fin -->
    <ellipse cx="377" cy="175" rx="30" ry="17"/>            <!-- body -->
    <circle cx="393" cy="169" r="3.5" fill="#1565C0"/>      <!-- eye -->
    <!-- dorsal fin -->
    <polygon points="374,160 384,151 388,160" opacity="0.75"/>
  </g>
  <!-- wave -->
  <path d="M 348,197 Q 358,190 368,197 Q 378,190 388,197 Q 398,190 408,197"
        stroke="white" stroke-width="3.5" fill="none"
        stroke-linecap="round" opacity="0.75"/>

  <!-- ══════════ 2. PLANTS — tree ══════════ -->
  <g fill="white" opacity="0.95">
    <polygon points="444,262 472,312 416,312"/>              <!-- canopy -->
    <polygon points="430,295 458,295 458,312 430,312" fill="rgba(255,255,255,0.6)"/> <!-- inner shade -->
    <rect x="440" y="312" width="8" height="20" rx="3"/>     <!-- trunk -->
  </g>

  <!-- ══════════ 3. INSECTS — butterfly ══════════ -->
  <g fill="white" opacity="0.95">
    <ellipse cx="356" cy="412" rx="21" ry="14" transform="rotate(-30 356 412)"/>  <!-- L top wing -->
    <ellipse cx="388" cy="412" rx="21" ry="14" transform="rotate( 30 388 412)"/>  <!-- R top wing -->
    <ellipse cx="359" cy="432" rx="14" ry="9"  transform="rotate( 35 359 432)"/>  <!-- L bot wing -->
    <ellipse cx="385" cy="432" rx="14" ry="9"  transform="rotate(-35 385 432)"/>  <!-- R bot wing -->
    <ellipse cx="372" cy="421" rx="3.5" ry="17" fill="#F57F17"/>                  <!-- body -->
    <!-- antennae -->
    <line x1="370" y1="406" x2="362" y2="393" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="374" y1="406" x2="382" y2="393" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="361" cy="392" r="3" fill="white"/>
    <circle cx="383" cy="392" r="3" fill="white"/>
  </g>

  <!-- ══════════ 4. BIRDS — bird in flight ══════════ -->
  <path d="M 202,419 Q 215,407 228,419 Q 241,407 254,419"
        stroke="white" stroke-width="7.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <ellipse cx="228" cy="425" rx="9" ry="6"
           transform="rotate(-10 228 425)" fill="white" opacity="0.95"/>
  <!-- tail -->
  <path d="M 220,429 L 211,441  M 225,431 L 220,443  M 231,430 L 228,443"
        stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- ══════════ 5. ANIMALS — paw print ══════════ -->
  <g fill="white" opacity="0.95">
    <ellipse cx="156" cy="312" rx="19" ry="15"/>    <!-- main pad -->
    <circle cx="138" cy="293" r="8"/>               <!-- toe 1 -->
    <circle cx="156" cy="288" r="8"/>               <!-- toe 2 -->
    <circle cx="174" cy="293" r="8"/>               <!-- toe 3 -->
  </g>

  <!-- ══════════ 6. PEOPLE — stick figure ══════════ -->
  <g stroke="white" stroke-linecap="round" fill="white" opacity="0.95">
    <circle cx="228" cy="152" r="15" stroke="none"/>         <!-- head -->
    <line x1="228" y1="167" x2="228" y2="193" stroke-width="7"/>  <!-- body -->
    <line x1="211" y1="178" x2="245" y2="178" stroke-width="6"/>  <!-- arms -->
    <line x1="228" y1="193" x2="215" y2="212" stroke-width="6"/>  <!-- L leg -->
    <line x1="228" y1="193" x2="241" y2="212" stroke-width="6"/>  <!-- R leg -->
  </g>

  <!-- ══════════ CENTRE CIRCLE ══════════ -->
  <circle cx="300" cy="300" r="55" fill="white"/>
  <!-- leaf decoration -->
  <path d="M 300,276 C 322,276 332,292 322,310
           C 314,324 296,323 292,310
           C 288,296 294,276 300,276 Z"
        fill="#2E7D32"/>
  <line x1="300" y1="310" x2="300" y2="325"
        stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round"/>
</svg>
